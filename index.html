<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShadesoN Visualizer</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="safe-top"></div><div id="safe-bottom"></div>
  <div id="center"><div id="hook" contenteditable="false" spellcheck="false">YOUR HOOK HERE</div>
    <div id="bpm"></div></div>
  <div id="start"><h1>ShadesoN</h1>
    <label class="big">LOAD TRACK<input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a" hidden></label>
    <p>mp3 · wav · m4a — double-tap hook to edit</p></div>
  <div id="bar" class="hidden"><span id="toggle">❚❚ tap to pause</span>
    <button id="rec" type="button" title="Record 9:16 with hook text + audio">● REC</button>
    <label class="mini">BPM<input id="showbpm" type="checkbox" checked></label></div>
</div>
<script type="module" src="ui.js?v=2d"></script>
</body></html>
